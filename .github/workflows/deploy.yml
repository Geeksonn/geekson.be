name: Deploy to OVH

on:
    push:
        branches: [main, redesign] # TEMP: redesign only runs a dry-run, remove once the FTP connection is validated
    workflow_dispatch:

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run build

            # Uploads only the files that changed since the previous deploy (tracked in a state file on the server).
            - name: Upload to OVH
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  protocol: ftps
                  local-dir: ./out/
                  server-dir: ./www/
                  dry-run: ${{ github.ref != 'refs/heads/main' }}
