name: Deploy to OVH

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run build

            - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

            # OVH web hosting does not support FTPS, so files go over SFTP. Old files on the server are kept (no --delete).
            # Outside main, only list the remote folder and print what would be uploaded.
            - name: Upload to OVH
              env:
                  FTP_SERVER: ${{ secrets.FTP_SERVER }}
                  FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
                  LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
                  DRY_RUN: ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }}
              run: |
                  lftp -c "
                      set sftp:auto-confirm yes
                      set net:max-retries 2
                      set net:timeout 20
                      open --env-password -u \"$FTP_USERNAME\" sftp://$FTP_SERVER
                      cls -1 www/
                      mirror --reverse --verbose $DRY_RUN ./out/ www/
                  "
